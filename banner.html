<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO GitHub Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .banner {
            width: 1280px;
            height: 640px;
            background: linear-gradient(135deg, #1a1f2e 0%, #2d3548 50%, #1a1f2e 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 背景装饰 */
        .banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .banner::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            font-size: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 30px rgba(102, 126, 234, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .title {
            font-size: 72px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }

        .subtitle {
            font-size: 32px;
            color: #8b949e;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .features {
            display: flex;
            gap: 30px;
            margin-bottom: 50px;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 140px;
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .feature-text {
            color: #c9d1d9;
            font-size: 16px;
            font-weight: 500;
        }

        .badges {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .badge {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .footer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #484f58;
            font-size: 14px;
        }

        /* 装饰元素 */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        .sparkle:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 25%; right: 15%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 35%; left: 20%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 25%; right: 25%; animation-delay: 1.5s; }
        .sparkle:nth-child(5) { top: 50%; left: 5%; animation-delay: 0.3s; }
        .sparkle:nth-child(6) { top: 40%; right: 5%; animation-delay: 0.8s; }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* GitHub 风格代码块装饰 */
        .code-decoration {
            position: absolute;
            top: 30px;
            left: 30px;
            font-family: "Monaco", "Consolas", monospace;
            font-size: 12px;
            color: #8b949e;
            opacity: 0.3;
        }

        .code-decoration div {
            margin-bottom: 5px;
        }

        .code-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .line-number {
            color: #484f58;
            min-width: 20px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- 装饰元素 -->
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>

        <!-- 代码装饰 -->
        <div class="code-decoration">
            <div class="code-line"><span class="line-number">1</span><span>npm install -g momo</span></div>
            <div class="code-line"><span class="line-number">2</span><span>momo start</span></div>
            <div class="code-line"><span class="line-number">3</span><span># 🐾 Your AI assistant</span></div>
        </div>

        <div class="content">
            <!-- Logo -->
            <div class="logo">🐾</div>

            <!-- 标题 -->
            <h1 class="title">MOMO</h1>
            <p class="subtitle">你的 AI 办公小狗狗</p>

            <!-- 特性 -->
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🎓</span>
                    <span class="feature-text">学习助手</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">💻</span>
                    <span class="feature-text">编程辅助</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">📸</span>
                    <span class="feature-text">截图工具</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">💬</span>
                    <span class="feature-text">飞书集成</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🧠</span>
                    <span class="feature-text">智能记忆</span>
                </div>
            </div>

            <!-- 徽章 -->
            <div class="badges">
                <span class="badge">✨ Open Source</span>
                <span class="badge">🎓 For Students</span>
                <span class="badge">🤖 AI Powered</span>
                <span class="badge">🔒 Secure</span>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            Made with 🐾 by Marcus Cheng · GitHub: @Cheng2121qwq
        </div>
    </div>
</body>
</html>
