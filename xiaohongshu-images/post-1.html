<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO 小红书配图 1 - 产品亮相</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .post {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 背景装饰 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .bg-circle:nth-child(1) {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -200px;
        }

        .bg-circle:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px;
        }

        .logo {
            font-size: 200px;
            margin-bottom: 40px;
            filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .title {
            font-size: 72px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 5px;
        }

        .subtitle {
            font-size: 36px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 60px;
            font-weight: 300;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 60px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .feature-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .feature-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
        }

        .cta {
            background: #ffffff;
            color: #667eea;
            padding: 25px 60px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .footer {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
        }

        /* 闪光效果 */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        .sparkle:nth-child(1) { top: 10%; left: 10%; }
        .sparkle:nth-child(2) { top: 20%; right: 15%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 30%; left: 20%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 40%; right: 25%; animation-delay: 1.5s; }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>

        <div class="content">
            <div class="logo">🐾</div>
            <h1 class="title">MOMO</h1>
            <p class="subtitle">你的 AI 办公小狗狗</p>

            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon">📸</div>
                    <div class="feature-text">截图发送</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📝</div>
                    <div class="feature-text">文件管理</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">💻</div>
                    <div class="feature-text">编程辅助</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎓</div>
                    <div class="feature-text">学习助手</div>
                </div>
            </div>

            <div class="cta">免费开源 · 一键安装</div>
        </div>

        <div class="footer">GitHub: Cheng2121qwq/momo</div>
    </div>
</body>
</html>
