<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO 配图 17 - 深夜加班</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .post {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .time {
            font-size: 80px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .title {
            font-size: 56px;
            color: #fff;
            font-weight: bold;
        }
        .message {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .message-text {
            font-size: 28px;
            color: #fff;
            line-height: 1.8;
            text-align: center;
        }
        .message-highlight {
            color: #f5576c;
            font-weight: bold;
        }
        .tips {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .tip {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .tip-icon {
            font-size: 40px;
        }
        .tip-text {
            font-size: 20px;
            color: #fff;
        }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="header">
            <div class="time">🌙 11:30 PM</div>
            <h1 class="title">老板，该休息了</h1>
        </div>
        <div class="message">
            <div class="message-text">
                "我知道这个项目很重要<br>
                但是<span class="message-highlight">身体更重要</span><br>
                今天已经工作 14 小时了<br>
                剩下的明天再做吧<br>
                我陪你一起加班<br>
                但现在<span class="message-highlight">去睡觉吧</span>"
            </div>
        </div>
        <div class="tips">
            <div class="tip">
                <div class="tip-icon">💧</div>
                <div class="tip-text">喝杯温水</div>
            </div>
            <div class="tip">
                <div class="tip-icon">🧘</div>
                <div class="tip-text">伸展一下身体</div>
            </div>
            <div class="tip">
                <div class="tip-icon">📱</div>
                <div class="tip-text">放下手机</div>
            </div>
            <div class="tip">
                <div class="tip-icon">😴</div>
                <div class="tip-text">早点休息</div>
            </div>
        </div>
        <div class="footer">🐾 MOMO 关心你，晚安</div>
    </div>
</body>
</html>
