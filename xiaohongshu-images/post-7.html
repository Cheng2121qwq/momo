<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO 配图 7 - 安装教程</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .post {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .title {
            font-size: 64px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .steps {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .step {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .step-number {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }
        .step-content {
            flex: 1;
        }
        .step-title {
            font-size: 28px;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .step-desc {
            font-size: 20px;
            color: #666;
            line-height: 1.5;
        }
        .code {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 18px;
            margin-top: 15px;
        }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="header">
            <h1 class="title">🚀 3 分钟安装 MOMO</h1>
            <p class="subtitle">超简单！一行命令搞定</p>
        </div>
        <div class="steps">
            <div class="step">
                <div class="step-number">1</div>
                <div class="step-content">
                    <div class="step-title">打开终端</div>
                    <div class="step-desc">macOS 用户按 Cmd+Space，搜索"终端"</div>
                </div>
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <div class="step-content">
                    <div class="step-title">复制安装命令</div>
                    <div class="code">curl -fsSL https://raw.githubusercontent.com/Cheng2121qwq/momo/main/install.sh | bash</div>
                </div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div class="step-content">
                    <div class="step-title">粘贴并回车</div>
                    <div class="step-desc">等待自动安装完成，看到"安装成功"提示</div>
                </div>
            </div>
            <div class="step">
                <div class="step-number">4</div>
                <div class="step-content">
                    <div class="step-title">开始使用</div>
                    <div class="step-desc">在飞书里和 MOMO 对话，或者用命令行操作</div>
                </div>
            </div>
        </div>
        <div class="footer">⏱️ 预计时间：3 分钟 · 💰 费用：免费</div>
    </div>
</body>
</html>
