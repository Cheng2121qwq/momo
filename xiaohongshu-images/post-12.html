<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO 配图 12 - 价格对比</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .post {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .title {
            font-size: 64px;
            color: #333;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .comparison {
            flex: 1;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 50px;
        }
        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 20px;
        }
        .product.other {
            background: #f5f5f5;
        }
        .product.momo {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .product-name {
            font-size: 32px;
            font-weight: bold;
        }
        .product.other .product-name {
            color: #333;
        }
        .product.momo .product-name {
            color: #fff;
        }
        .product-price {
            font-size: 42px;
            font-weight: bold;
        }
        .product.other .product-price {
            color: #999;
        }
        .product.momo .product-price {
            color: #fff;
        }
        .savings {
            background: rgba(255,255,255,0.8);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-top: 30px;
        }
        .savings-title {
            font-size: 24px;
            color: #666;
            margin-bottom: 15px;
        }
        .savings-amount {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .footer {
            text-align: center;
            color: rgba(0,0,0,0.6);
            font-size: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="header">
            <h1 class="title">💰 AI 助手价格对比</h1>
            <p class="subtitle">为什么 MOMO 最香？</p>
        </div>
        <div class="comparison">
            <div class="product other">
                <div class="product-name">某 Chat Plus</div>
                <div class="product-price">¥20/月</div>
            </div>
            <div class="product other">
                <div class="product-name">某 Copilot</div>
                <div class="product-price">$10/月</div>
            </div>
            <div class="product other">
                <div class="product-name">某 Assistant</div>
                <div class="product-price">$10/月</div>
            </div>
            <div class="product other">
                <div class="product-name">某 Notion AI</div>
                <div class="product-price">$10/月</div>
            </div>
            <div class="product momo">
                <div class="product-name">🐾 MOMO</div>
                <div class="product-price">免费</div>
            </div>
            <div class="savings">
                <div class="savings-title">一年省下</div>
                <div class="savings-amount">¥840 - ¥2000+</div>
            </div>
        </div>
        <div class="footer">完全免费 · 开源透明 · 功能更多</div>
    </div>
</body>
</html>
