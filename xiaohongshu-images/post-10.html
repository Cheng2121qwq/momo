<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO 配图 10 - 学习技巧</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .post {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .title {
            font-size: 64px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .tips {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .tip {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .tip-number {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }
        .tip-content {
            flex: 1;
        }
        .tip-title {
            font-size: 26px;
            color: #333;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .tip-desc {
            font-size: 18px;
            color: #666;
        }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="header">
            <h1 class="title">📚 MOMO 学习技巧</h1>
            <p class="subtitle">5 个方法，成绩提升</p>
        </div>
        <div class="tips">
            <div class="tip">
                <div class="tip-number">1</div>
                <div class="tip-content">
                    <div class="tip-title">🍅 番茄工作法</div>
                    <div class="tip-desc">25 分钟专注 +5 分钟休息，效率翻倍</div>
                </div>
            </div>
            <div class="tip">
                <div class="tip-number">2</div>
                <div class="tip-content">
                    <div class="tip-title">📝 主动回忆</div>
                    <div class="tip-desc">学完合上书，回忆重点，加深记忆</div>
                </div>
            </div>
            <div class="tip">
                <div class="tip-number">3</div>
                <div class="tip-content">
                    <div class="tip-title">🎯 费曼技巧</div>
                    <div class="tip-desc">用自己的话解释，教会别人=学会</div>
                </div>
            </div>
            <div class="tip">
                <div class="tip-number">4</div>
                <div class="tip-content">
                    <div class="tip-title">📋 任务分解</div>
                    <div class="tip-desc">大任务拆成小任务，逐个击破</div>
                </div>
            </div>
            <div class="tip">
                <div class="tip-number">5</div>
                <div class="tip-content">
                    <div class="tip-title">⏰ 定期复习</div>
                    <div class="tip-desc">1 天、3 天、7 天、15 天，对抗遗忘</div>
                </div>
            </div>
        </div>
        <div class="footer">MOMO 帮你管理学习计划 🐾</div>
    </div>
</body>
</html>
