<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO 小红书配图 4 - 对比测评</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .post {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #f093fb 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px;
            width: 100%;
        }

        .header {
            margin-bottom: 50px;
        }

        .header-emoji {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 56px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.9);
        }

        .comparison-table {
            background: #ffffff;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .table-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 22px;
        }

        .table-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 20px;
            padding: 25px;
            border-bottom: 1px solid #eee;
            font-size: 20px;
            align-items: center;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .feature-name {
            text-align: left;
            color: #333;
            font-weight: 600;
        }

        .other-cell {
            text-align: center;
            color: #999;
        }

        .momo-cell {
            text-align: center;
            color: #f5576c;
            font-weight: bold;
            background: rgba(245, 87, 108, 0.1);
            border-radius: 10px;
            padding: 10px;
        }

        .price-row {
            background: rgba(245, 87, 108, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }

        .price-compare {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .price-item {
            text-align: center;
        }

        .price-label {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .price-value {
            font-size: 42px;
            font-weight: bold;
        }

        .price-value.other {
            color: #999;
        }

        .price-value.momo {
            color: #f5576c;
        }

        .cta {
            background: #ffffff;
            color: #f5576c;
            padding: 25px 60px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-top: 40px;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="content">
            <div class="header">
                <div class="header-emoji">⚖️</div>
                <h1 class="title">AI 助手大对比</h1>
                <p class="subtitle">为什么我选择了 MOMO？</p>
            </div>

            <div class="comparison-table">
                <div class="table-header">
                    <div>功能</div>
                    <div>其他 AI</div>
                    <div>MOMO</div>
                </div>

                <div class="table-row">
                    <div class="feature-name">💬 聊天对话</div>
                    <div class="other-cell">✅</div>
                    <div class="momo-cell">✅</div>
                </div>

                <div class="table-row">
                    <div class="feature-name">💻 编程辅助</div>
                    <div class="other-cell">✅</div>
                    <div class="momo-cell">✅</div>
                </div>

                <div class="table-row">
                    <div class="feature-name">📸 截图发送</div>
                    <div class="other-cell">❌</div>
                    <div class="momo-cell">✅</div>
                </div>

                <div class="table-row">
                    <div class="feature-name">📁 文件管理</div>
                    <div class="other-cell">❌</div>
                    <div class="momo-cell">✅</div>
                </div>

                <div class="table-row">
                    <div class="feature-name">🧠 记忆系统</div>
                    <div class="other-cell">❌</div>
                    <div class="momo-cell">✅</div>
                </div>

                <div class="table-row">
                    <div class="feature-name">🐕 有性格</div>
                    <div class="other-cell">❌</div>
                    <div class="momo-cell">✅✅</div>
                </div>
            </div>

            <div class="price-row">
                <div class="price-compare">
                    <div class="price-item">
                        <div class="price-label">其他 AI</div>
                        <div class="price-value other">$10/月<br><span style="font-size:18px">≈¥720/年</span></div>
                    </div>
                    <div class="price-item" style="font-size:48px;color:#f5576c">VS</div>
                    <div class="price-item">
                        <div class="price-label">MOMO</div>
                        <div class="price-value momo">免费<br><span style="font-size:18px">开源项目</span></div>
                    </div>
                </div>
            </div>

            <div class="cta">真香警告！😍</div>
        </div>

        <div class="footer">GitHub: Cheng2121qwq/momo</div>
    </div>
</body>
</html>
