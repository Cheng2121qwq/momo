<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO 配图 13 - 用户评价</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .post {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .title {
            font-size: 64px;
            color: #333;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .reviews {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .review {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
        }
        .review-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .user-tag {
            font-size: 16px;
            color: #667eea;
        }
        .review-text {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            font-style: italic;
        }
        .stars {
            font-size: 24px;
            margin-top: 15px;
        }
        .footer {
            text-align: center;
            color: rgba(0,0,0,0.6);
            font-size: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="header">
            <h1 class="title">💬 用户怎么说？</h1>
            <p class="subtitle">真实评价，不吹不黑</p>
        </div>
        <div class="reviews">
            <div class="review">
                <div class="review-header">
                    <div class="avatar">👨‍🎓</div>
                    <div class="user-info">
                        <div class="user-name">小李</div>
                        <div class="user-tag">大学生 · 计算机专业</div>
                    </div>
                </div>
                <div class="review-text">
                    "MOMO 帮我管理作业，再也没忘记过截止日期！成绩从 3.0 提升到 3.8，太感谢了！"
                </div>
                <div class="stars">⭐⭐⭐⭐⭐</div>
            </div>
            <div class="review">
                <div class="review-header">
                    <div class="avatar">👨‍💻</div>
                    <div class="user-info">
                        <div class="user-name">王哥</div>
                        <div class="user-tag">程序员 · 996</div>
                    </div>
                </div>
                <div class="review-text">
                    "每天少加班 1-2 小时，终于有时间陪家人了。比 Copilot 香，还免费！"
                </div>
                <div class="stars">⭐⭐⭐⭐⭐</div>
            </div>
            <div class="review">
                <div class="review-header">
                    <div class="avatar">👩‍💼</div>
                    <div class="user-info">
                        <div class="user-name">张姐</div>
                        <div class="user-tag">行政 · 办公族</div>
                    </div>
                </div>
                <div class="review-text">
                    "文件整理、截图发送太方便了！效率提升不止一倍，同事都问我在用什么神器"
                </div>
                <div class="stars">⭐⭐⭐⭐⭐</div>
            </div>
        </div>
        <div class="footer">GitHub: Cheng2121qwq/momo · 免费开源</div>
    </div>
</body>
</html>
