<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO 配图 15 - 里程碑</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .post {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .title {
            font-size: 64px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .milestones {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .milestone {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .milestone-icon {
            font-size: 60px;
            flex-shrink: 0;
        }
        .milestone-content {
            flex: 1;
        }
        .milestone-number {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }
        .milestone-label {
            font-size: 22px;
            color: rgba(255,255,255,0.9);
        }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="post">
        <div class="header">
            <h1 class="title">🎯 MOMO 里程碑</h1>
            <p class="subtitle">和我们一起成长</p>
        </div>
        <div class="milestones">
            <div class="milestone">
                <div class="milestone-icon">⭐</div>
                <div class="milestone-content">
                    <div class="milestone-number">100+</div>
                    <div class="milestone-label">GitHub Stars</div>
                </div>
            </div>
            <div class="milestone">
                <div class="milestone-icon">🍴</div>
                <div class="milestone-content">
                    <div class="milestone-number">25+</div>
                    <div class="milestone-label">Forks</div>
                </div>
            </div>
            <div class="milestone">
                <div class="milestone-icon">👥</div>
                <div class="milestone-content">
                    <div class="milestone-number">500+</div>
                    <div class="milestone-label">安装量</div>
                </div>
            </div>
            <div class="milestone">
                <div class="milestone-icon">💬</div>
                <div class="milestone-content">
                    <div class="milestone-number">50+</div>
                    <div class="milestone-label">Issues & PRs</div>
                </div>
            </div>
            <div class="milestone">
                <div class="milestone-icon">🚀</div>
                <div class="milestone-content">
                    <div class="milestone-number">Next</div>
                    <div class="milestone-label">1000 Stars!</div>
                </div>
            </div>
        </div>
        <div class="footer">GitHub: Cheng2121qwq/momo · 感谢每一位支持者</div>
    </div>
</body>
</html>
