<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MOMO 配图 28</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}.post{width:1080px;height:1440px;background:linear-gradient(135deg,#f093fb,#f5576c);padding:60px;display:flex;flex-direction:column}.header{text-align:center;margin-bottom:40px}.title{font-size:64px;color:#fff;font-weight:bold}.workflow{flex:1;display:flex;flex-direction:column;gap:20px}.step{background:rgba(255,255,255,0.95);border-radius:15px;padding:25px;display:flex;align-items:center;gap:20px}.num{width:50px;height:50px;background:#f5576c;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#fff}.text{font-size:22px;color:#333;flex:1}.footer{text-align:center;color:rgba(255,255,255,0.7);font-size:20px;margin-top:30px}</style></head><body><div class="post"><div class="header"><h1 class="title">🔀 Git 工作流</h1></div><div class="workflow"><div class="step"><div class="num">1</div><div class="text">git checkout -b feature</div></div><div class="step"><div class="num">2</div><div class="text">开发新功能</div></div><div class="step"><div class="num">3</div><div class="text">git commit -m "feat: xxx"</div></div><div class="step"><div class="num">4</div><div class="text">git push origin feature</div></div><div class="step"><div class="num">5</div><div class="text">创建 Pull Request</div></div></div><div class="footer">🐾 MOMO 帮你管理 Git</div></div></body></html>
